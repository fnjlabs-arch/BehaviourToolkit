# This workflow will update the submodule branch

name: Update Submodule Branch

on:
  push:
    branches:
      - main

jobs:
  submodule:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout 
      uses: actions/checkout@v2
    
    - name: Setup Git
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git fetch
    
    - name: Clean Submodule
      run: |
        git checkout submodule
        git rm -r .

    - name: Update from Main
      run: |
        git checkout main -- addons/sadsha_behaviour_kit
        mv addons/sadsha_behaviour_kit/* .
        git rm -r addons/sadsha_behaviour_kit

    - name: Commit to Submodule
      continue-on-error: true
      run: |
        git add -A
        git commit -am "Updated Submodule from Main"
        git push
